name = "irecover"
compatibility_date = "2024-09-25"
pages_build_output_dir = "dist"

# Server-side Photo Finish / Geographic Analysis credentials are NOT set
# here -- configure them as encrypted environment variables in the
# Cloudflare Pages dashboard (Settings -> Environment variables) for
# Production and Preview, or in a local, gitignored .dev.vars file for
# `wrangler pages dev`:
#
#   CLOUDINARY_CLOUD_NAME=...
#   CLOUDINARY_API_KEY=...
#   CLOUDINARY_API_SECRET=...
#   GEMINI_API_KEY=...
